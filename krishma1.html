<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiple Texts Typing Animation | CodingNepal</title>
  <link rel="stylesheet" href="krishma1.css">
</head>
<body>
  <div class="main">
    
    <p class="top-text">Learn a new skill, launch a project, land your dream career.</p>

    <div class="content">
      <div class="static-txt">1 on 1</div>
      <ul class="animation-txts">
        <li><span>Data Science</span></li>
        <li><span>UI & UX Design</span></li>
        <li><span>Machine Learning</span></li>
        <li><span>Java Script</span></li>
      </ul>
    </div>
    <div class="static-txt">Mentorship</div>

    
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Search...">
      <button type="submit" class="find-btn">Find Mentor</button>
    </div>

    
    <div class="categories">
      <p class="styled-text">Project Managers</p>
      <p class="styled-text">Career Coaches</p>
      <p class="styled-text">Software Engineers</p>
    </div>
    <div class="categories">
      <p class="styled-text">Leadership Mentors</p>
      <p class="styled-text">UX Designers</p>
      <p class="styled-text">Data Scientists</p>
      <p class="styled-text">Startup Founders</p>
    </div>
  </div>
</body>
</html>
